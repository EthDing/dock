name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@10.34.5 --activate
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
  harbor-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install harbor==0.22.0
      - run: python -m unittest discover -s integrations/harbor/tests -v
